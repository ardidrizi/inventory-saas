services:
  mongo:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all --port 27018
    restart: unless-stopped
    ports:
      - "27018:27018"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    command: >
      bash -c "until mongosh --host mongo:27018 --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; do sleep 1; done &&
      mongosh --host mongo:27018 --quiet --eval \"const cfg={_id:'rs0',members:[{_id:0,host:'localhost:27018'}]};try{const current=rs.status().members?.[0]?.name;if(current!==cfg.members[0].host){rs.reconfig(cfg,{force:true});print('Replica set reconfigured to localhost:27018')}else{print('Replica set already configured')}}catch(e){rs.initiate(cfg);print('Replica set initiated on localhost:27018')}\""
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27018/inventory?replicaSet=rs0
    depends_on:
      - mongo
      - mongo-init
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
